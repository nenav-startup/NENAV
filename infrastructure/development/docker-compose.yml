services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nenav-postgres
    restart: always
    environment:
      POSTGRES_DB: nenav_core
      POSTGRES_USER: nenav_admin
      POSTGRES_PASSWORD: nenav_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nenav_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nenav_admin -d nenav_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nenav-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - nenav_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nenav_pg_data:
  nenav_redis_data:
