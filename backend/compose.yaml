# ==========================================
# NENAV Backend — Local Development
# PostgreSQL 16 + PostGIS 3.4 + Redis 7
# ==========================================

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: nenav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nenav
      POSTGRES_PASSWORD: nenav_local_dev
      POSTGRES_DB: nenav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nenav -d nenav"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: nenav-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
